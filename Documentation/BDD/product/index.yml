features:
  authentication:
    description: User authentication and early access management
    file: authentication.feature
    scenarios:
      - Google sign-in
      - Session persistence
      - Early access requests
      - Whitelist management
      - User access control
    implementations:
      - src/app/api/auth/[...nextauth]/options.js
      - src/lib/neo4j/userRepository.js
      - src/app/api/auth/whitelist/route.js
      - src/app/page.js
      - src/app/early-access/page.js

  graph_visualization:
    description: Interactive graph visualization of images, users, and attributes
    file: graph_visualization.feature
    scenarios:
      - Graph display with D3.js
      - Node properties and theming
      - Interactive navigation
      - Error handling and recovery
      - Performance optimization
    implementations:
      - src/components/GraphVisualization.jsx
      - src/hooks/useD3Graph.js
      - src/lib/d3/core/GraphInitializer.js
      - src/lib/d3/core/GraphManager.js
      - src/lib/d3/rendering/NodeRenderer.js
      - src/lib/d3/layouts/spiral/SpiralCalculator.js
      - src/lib/d3/layouts/boundingCircles.js
      - src/lib/d3/interactions/hover.js
      - src/lib/d3/interactions/edgeBundling.js
      - src/lib/d3/forceConfig.js
    documentation:
      - src/lib/d3/README.md
      - src/lib/d3/core/ARCHITECTURE.md
      - src/lib/d3/layouts/README.md
      - src/lib/d3/layouts/spiral/README.md
      - Documentation/revised-refactoring-plan.md

  image_upload:
    description: Image upload workflow with AI analysis
    file: image_upload.feature
    scenarios:
      - First-time user sign-in
      - Image upload process
      - Unauthorized attempts
      - Duplicate detection
      - AI analysis with Anthropic
      - Error handling
      - Performance optimization
    implementations:
      - src/app/api/images/upload/route.js
      - src/app/api/images/process/route.js
      - src/lib/neo4j/imageRepository.js
      - src/lib/image/imageAnalyzer.js
      - src/lib/neo4j/userRepository.js
      - src/lib/storage/gcs.js
    documentation:
      - src/lib/image/README.md
      - src/lib/storage/README.md

  production_readiness:
    description: Production deployment and configuration
    file: production_readiness.feature
    scenarios:
      - Secret validation
      - Docker container build
      - Cloud Run deployment
      - Runtime configuration
      - Error handling and logging
    implementations:
      - scripts/prod-deploy-cloud-run.ps1
      - Dockerfile

  theme_initialization:
    description: Theme management and initialization
    file: theme_initialization.feature
    scenarios:
      - SSR compatibility
      - Theme provider initialization
      - Theme toggle functionality
      - Windows compatibility
      - Error handling
    implementations:
      - src/components/ThemeProvider.jsx
      - src/hooks/useTheme.js
      - src/components/Navbar.js