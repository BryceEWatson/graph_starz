---
name: Graph Starz LLM Coding Guidelines
description: Concise coding guidelines for LLM code generation in Graph Starz (Next.js/Node.js focused).
version: 1.4.0
last_updated: "2024-12-30"

general_principles:
  description: Core principles for all JavaScript/Node.js code.
  rules:
    - id: KISS
      description: Keep code simple, avoid over-engineering.
      how_to: Use the simplest logic to achieve the desired output. Break down complex logic into smaller functions.
      example: |
        // BAD: Nested ifs
        if (x > 0) { if (y < 10) { return true } }
        // GOOD: Single condition
        if (x > 0 && y < 10) { return true }
    - id: POLA
      description: Follow common JavaScript/Node.js coding patterns and conventions.
      how_to: Use idiomatic style for JavaScript/Node.js (e.g., camelCase for variables, PascalCase for components).
      example: |
        // BAD: snake_case
        let my_var_name = "hello";
        // GOOD: camelCase
        let myVarName = "hello";
    - id: SRP
      description: Each function/module has one specific job.
      how_to: Separate different concerns into separate functions/modules.
      example: |
        // BAD: Single fn does many things
        function processUser(data) { validate(); createObj(); save() }
        // GOOD: Separate fns
        function validate(data); function createObj(data); function save(obj)
    - id: DRY
      description: Avoid repeating code. Use shared functions.
      how_to: Refactor duplicated code into reusable functions.
      example: |
        // BAD: Duplicated Logic
        function area1(w, h) { return w * h } function area2(w, h) { return w * h }
        // GOOD: Shared Function
        function area(w, h) { return w * h } function area1(w,h){ area(w,h) } function area2(w,h) { area(w,h) }
    - id: FailFast
      description: Report errors early, don't try to guess.
      how_to: Exit immediately with a clear error message when encountering critical errors.
    - id: ValidateEnv
      description: Validate env variables at startup.
      how_to: Check type and format, provide clear error messages. Do not use default values for environment variables, throw an error if not present.

testing:
  description: Test-driven development and test rules.
  rules:
    - id: TestFirst
      description: Write tests before implementation.
      how_to: Define test cases (normal, edge, error) *before* writing any implementation code.
      example: |
        // Test Example: add(a, b)
        // add(1, 2) -> 3 ; add(0,0) -> 0 ; add(-1, 1) -> 0
        test('add', () => { expect(add(1, 2)).toBe(3); expect(add(0, 0)).toBe(0); expect(add(-1, 1)).toBe(0) });
    - id: TestImpl
      description: Implement minimal code to pass tests.
      how_to: Write code to satisfy tests, with no more code than required.
    - id: TestFiles
      description: Test files in __tests__ dir, mock files in __mocks__ dir. Use .test.js extension.
      how_to: Test files should be in `__tests__` directory, mock files in `__mocks__`, utilities in `__test_utils__`. Test files should end in `.test.js`
    - id: JestMocking
      description: Use Jest mocking consistently, reuse mocks. Mock D3 using d3Mock.js, ensure method chaining.
      how_to: Ensure that reusable mocks are kept in `__mocks__`, and that the d3 mock from `__mocks__/d3Mock.js` is used for all d3 mocking.

code_style:
  description: Code formatting and structure rules.
  rules:
    - id: UseClient
      description: Add 'use client' directive in NextJS client components.
      how_to: Start client-side NextJS components with `use client`.
      example: `"use client"; function MyComponent() { //.. }`
    - id: NoSemicolons
      description: Avoid trailing semicolons in NextJS.
      how_to: Omit semicolons at the end of statements unless required by language.
      example: `let a = 1` // Good
    - id: LFLineEndings
      description: Use LF line endings.
      how_to: Ensure all files use LF, not CRLF endings.
    - id: NoSpecialChars
      description: Avoid special chars/emojis in code.
      how_to: Avoid using special characters or emojis in code or documentation.

error_handling:
  description: Error handling rules.
  rules:
      - id: TryCatch
        description: Use try-catch blocks for potential errors.
        how_to: Wrap code that may error in `try...catch`, log the error, and attempt to recover or rethrow an error.
        example: |
          try {
            result = 1 / 0;
          } catch (e) {
            console.error('Error:', e);
            result = 0;
          }
      - id: DetailedErrors
        description: Provide detailed, human-readable error messages.
        how_to: Include error type, message, and other useful error information like stack traces.
        example: `console.error('Error: Cannot connect. Type: ${e}, Stack: ${trace}');`
      - id: HTTPCodes
        description: Use specific HTTP codes for API responses.
        codes:
          401: Authentication/Authorization
          409: Resource conflicts
          400: Invalid requests
          500: Server errors
      - id: PowerErrors
        description: Powershell specific error message formatting rules.
        how_to: Do not add colons before error variables (e.g., use "Error $_" not "Error: $_"). Use string concatenation for error messages (e.g., "Failed to test $endpoint $_").

deployment:
  description: Deployment script rules.
  rules:
    - id: EnvChecks
      description: Verify environment in deployment scripts.
      how_to: Ensure that deployment scripts verify tools, env vars, and network connectivity to services.
    - id: NoSilentFailures
      description: Scripts must not continue if prerequisites are not met.
      how_to: Validate each step in the deployment, and exit with error codes if a step fails.
    - id: WindowsPowershell
      description: Ensure Windows PowerShell compatibility for scripts. Use \\ for windows file paths.
      how_to: Use Windows PowerShell as the primary shell, and ensure that all script paths use the \\ path separators.

documentation:
  description: Documentation and BDD rules.
  rules:
    - id: NoHypothetical
      description: Documentation must be accurate, no hypothetical content.
      how_to: Ensure documentation accurately reflects the current state of code.
    - id: FeatureCodeAlign
      description: Feature files must match code.
      how_to: Ensure that feature files match the implemented functionality of the system. Update docs and features when code changes.

feature_integration:
  description: Rules for integrating new features.
  rules:
      - id: APIConsistency
        description: Maintain consistent APIs and data structures.
        how_to: Follow existing API patterns and naming conventions, ensure backward compatibility, or document breaking changes.
      - id: ComponentDeps
        description: Map and update tests for affected components.
        how_to: Map all components affected by a new feature, and ensure that each component has corresponding tests, and that mock data matches production data structures.
      - id: SystemArch
        description: Follow established architectural patterns.
        how_to: Follow existing architecture patterns, maintain separation of concerns.
      - id: DataConsistency
        description: Use consistent data structures throughout.
        how_to: Document data schemas and transformations, validate data at system boundaries, and maintain integrity across components.

research_questions:
  description: When and how to ask research questions.
  rules:
    - id: WhenAsk
      description: Ask when behavior unclear, unsure about implementation, complex libs, or before assumptions.
      how_to: Ask questions when unsure of correct implementation approach, when encountering complex library interactions, or when encountering unexpected test failures. Do not make assumptions about system behavior.
    - id: Format
      description: Questions should be specific, focused, with code/test failures.
      how_to: Questions should be specific, state the problem clearly, include code snippets or test failures, state what you have already tried and why you are asking the question.

code_review:
    description: Rules for performing code reviews
    rules:
      - id: FeatureReview
        description: Review features for alignment, duplicate functionality, API consistency, and test coverage.
        how_to: Check for feature alignment with the product, duplicate functionality, API consistency, valid data structures, error handling, and test coverage during code review.
      - id: ArchitectureReview
        description: Review architecture fit, scalability, and security.
        how_to: Check architectural fit, scalability, maintainability, security, component interactions, and documentation updates during code review.

workflow:
  description: Development workflow steps.
  steps:
    - Write tests before implementation (TDD).
    - Document decisions in a journal.
    - Research solutions before implementation.
    - Regular code reviews.
    - Verify code matches BDD specifications.
    - Remove hypothetical content during reviews.
    - Update documentation to reflect state.
    - Development uses auto-cache clearing:
        description: The dev command automatically clears .next cache
        command: "cross-env DEBUG=app:* rimraf .next && cross-env DEBUG=app:* next dev"
        note: Manual cache clearing is not needed during development

feature_verification:
  description: Process for code-feature alignment.
  steps:
    - Review feature file scenarios and requirements.
    - Locate corresponding code implementations.
    - Compare behavior specifications with actual code.
    - Run tests to verify feature coverage.
    - Document gaps or inconsistencies.
    - Remove hypothetical scenarios.
    - Update implementation status.

test_driven_development:
  description: Guidelines for TDD practice.
  test_case_coverage:
    - Expected behavior and normal operations.
    - Edge cases and boundary conditions.
    - Error handling scenarios.
  workflow:
    - Write specific test cases with clear pass/fail criteria.
    - Write tests before implementing functionality.
    - Implement minimum code to make tests pass.
    - Refactor while maintaining passing tests.
    - Run full test suite on every code change.
  documentation:
    - Document test cases in test files.

research_process:
  description: System for tracking and resolving knowledge gaps.
  gap_identification:
    scenario:
      - Document code, commands, and observed behavior.
      - Note system state and conditions.
      - Identify recurring patterns.
  research_questions:
    format:
      - Clear problem statement.
      - Current knowledge and attempts.
      - Specific questions.
      - Supporting code/errors.
    tracking:
      - Add to "c:/Users/Bryce/Documents/Projects/graph_starz/Documentation/research_questions.md".
  solution_handling:
    - Share solutions in documentation.
